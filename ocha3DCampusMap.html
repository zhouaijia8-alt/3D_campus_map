<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>お茶大 学祭3Dキャンパスマップ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 上に校内地図(番号タップ)、下に選んだ建物の3Dマップ入口、最後に建物一覧 */
:root{
  --bg:#faf7f9; --surface:#ffffff; --fg:#2a1d26; --muted:#76646f;
  --line:#e6dbe2; --ng:#b3261e; --accent:#8c1d5c; --accent-fg:#ffffff; --linked:#1f4fd8; --soft:#f3e7ee;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171116; --surface:#221a21; --fg:#f3e9ef; --muted:#b2a0ab; --line:#3a2d37;
  --ng:#ff8f86; --accent:#e58bbd; --accent-fg:#1a0f16; --linked:#8fb0ff; --soft:#2f2230; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171116; --surface:#221a21; --fg:#f3e9ef; --muted:#b2a0ab; --line:#3a2d37;
  --ng:#ff8f86; --accent:#e58bbd; --accent-fg:#1a0f16; --linked:#8fb0ff; --soft:#2f2230; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;margin:0;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700}
h1{font-size:clamp(22px,5.6vw,32px);line-height:1.25;margin:0;font-weight:900;text-wrap:balance}
.lead{color:var(--muted);margin:6px 0 0;font-size:14px}
.map{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.stage{position:relative;line-height:0}
.stage img,.stage svg{display:block;width:100%;height:auto}
.stage svg{position:absolute;inset:0}
.pin{cursor:pointer}
.pin circle{fill:var(--accent);fill-opacity:.0;stroke:none;transition:fill-opacity .15s}
.pin:hover circle,.pin:focus circle{fill-opacity:.25;outline:none}
.pin.on circle{fill-opacity:.35;stroke:var(--accent);stroke-width:4}
.pin.has circle{fill:var(--linked);fill-opacity:.18;stroke:var(--linked);stroke-width:3}
.pin.has.on circle{fill-opacity:.4;stroke-width:5}
.pin.ng circle{fill:var(--ng);fill-opacity:.16;stroke:var(--ng);stroke-width:3;stroke-dasharray:6 5}
.pin.ng.on circle{fill-opacity:.35;stroke-width:5}
.legend i.x{border:1.5px dashed var(--ng);background:color-mix(in srgb,var(--ng) 20%,transparent)}
.chip em.ng{color:var(--ng)}
.tag{align-self:flex-start;font-size:13px;font-weight:700;padding:3px 12px;border-radius:999px;border:1.5px solid var(--ng);color:var(--ng)}
.campus{align-self:stretch;justify-content:center}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:8px 4px 2px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:5px;border:1.5px solid var(--linked);background:color-mix(in srgb,var(--linked) 25%,transparent)}
.legend i.n{border-color:var(--accent);background:transparent}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.no{font-family:var(--font-mono);font-size:12px;color:var(--accent);letter-spacing:.08em}
.panel h2{margin:0;font-size:20px;line-height:1.35;font-weight:700;text-wrap:balance}
.panel p{margin:0;color:var(--muted);font-size:14px}
.btn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;
  background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:16px;text-decoration:none;font-family:inherit;border:0}
.btn:focus-visible,.chip:focus-visible,.pin:focus-visible{outline:3px solid var(--linked);outline-offset:2px}
.btn[aria-disabled="true"]{background:var(--soft);color:var(--muted);pointer-events:none}
h3{margin:4px 0 0;font-size:14px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin:0;padding:0;list-style:none}
.chip{width:100%;display:flex;gap:10px;align-items:baseline;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);color:var(--fg);font:inherit;font-size:14px;cursor:pointer;min-width:0}
.chip b{font-family:var(--font-mono);font-weight:500;color:var(--accent);min-width:1.6em}
.chip span{min-width:0;overflow-wrap:anywhere}
.chip.on{border-color:var(--accent);background:var(--soft)}
.chip em{margin-left:auto;font-style:normal;font-size:11px;color:var(--linked);white-space:nowrap}
footer{font-size:12px;color:var(--muted)}
</style>

if (CAMPUS.m) {
  const a = $("#campusBtn"); a.hidden = false;
  if (MODE === "entry") { a.href = VIEWER_URL + "#campus"; } else a.addEventListener("click", e => { e.preventDefault(); select("campus", true); });
}

function select(no, scroll) {
  const b = no === "campus" ? null : (BUILDINGS.find(x => x.no === no) || BUILDINGS[1]);
  document.querySelectorAll(".pin,.chip").forEach(el => el.classList.toggle("on", !!b && +el.dataset.no === b.no));
  const p = $("#panel"); p.innerHTML = "";
  const mk = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt) e.textContent = txt; p.appendChild(e); return e; };
  const link = (txt, href, ext) => { const a = mk("a", "btn", txt); a.href = href; if (ext) { a.target = "_blank"; a.rel = "noopener"; } return a; };
  const frame = (id, title) => {
    const f = document.createElement("iframe");
    f.className = "frame"; f.src = embed(id); f.loading = "lazy"; f.title = title;
    f.allow = "fullscreen; xr-spatial-tracking; gyroscope; accelerometer"; f.allowFullscreen = true; p.appendChild(f);
    link("大きい画面で開く →", embed(id), true);
  };
  if (!b) {
    mk("div", "no", "CAMPUS");
    mk("h2", "", "キャンパス全体の3Dマップ");
    mk("p", "", "屋外を含むキャンパス全体を、3Dで見て回れます。");
    if (MODE === "viewer") frame(idOf(CAMPUS.m), "キャンパス全体の3Dマップ"); else link("3Dマップを開く →", VIEWER_URL + "#campus");
  } else {
    mk("div", "no", "BUILDING " + b.no);
    mk("h2", "", b.name);
    if (b.info) mk("p", "", b.info);
    if (b.ng) {
      mk("span", "tag", "立入禁止");
      mk("p", "", "この建物は立ち入り禁止エリアです。入らないでください。");
    } else if (b.m) {
      if (MODE === "viewer") frame(idOf(b.m), b.name + " 3Dマップ");
      else { link("この建物の内部を3Dで見る →", VIEWER_URL + "#b" + b.no); mk("p", "", "3Dビューのページが開きます。画面をなぞると見回せます。"); }
    } else {
      mk("p", "", "この建物の内部の3Dマップはありません。");
      if (CAMPUS.m) { if (MODE === "viewer") { const a = mk("a", "btn", "キャンパス全体の3Dマップを見る →"); a.href = "#campus"; } else link("キャンパス全体の3Dマップを見る →", VIEWER_URL + "#campus"); }
    }
  }
  try { history.replaceState(null, "", no === "campus" ? "#campus" : "#b" + b.no); } catch (e) {}
  if (scroll) p.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth", block: "nearest"});
}
const route = () => { const h = location.hash; if (h === "#campus" && CAMPUS.m) return select("campus", false); const m = /^#b(\d+)$/.exec(h); select(m ? +m[1] : 2, false); };
route();
if (MODE === "viewer") addEventListener("hashchange", route);
</script>

</body></html>
